<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jhonny Silva | Em Construção</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen flex flex-col items-center justify-between p-6 font-sans selection:bg-zinc-800">

  <!-- Topo -->
  <header class="w-full max-w-xl flex justify-between items-center py-4">
    <span class="text-sm font-semibold tracking-wider text-zinc-400">JHONNY SILVA</span>
    <span class="inline-flex items-center gap-1.5 px-3 py-1 text-xs font-medium text-emerald-400 bg-emerald-950/40 border border-emerald-800/50 rounded-full">
      <span class="h-1.5 w-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
      Em desenvolvimento
    </span>
  </header>

  <!-- Conteúdo Central -->
  <main class="w-full max-w-xl text-center space-y-6 my-auto">
    <h1 class="text-4xl sm:text-5xl font-extrabold tracking-tight text-zinc-50">
      Portfólio em desenvolvimento.
    </h1>
    <p class="text-zinc-400 text-base sm:text-lg leading-relaxed max-w-md mx-auto">
      Estou a finalizar projetos e a preparar a nova versão do site. Entretanto, podes contactar-me diretamente por email.
    </p>

    <!-- Botão de Email -->
    <div class="pt-2">
      <a href="mailto:contacto@jhonnysilva.pt" 
         class="inline-flex items-center justify-center px-6 py-3 rounded-lg bg-zinc-100 text-zinc-950 font-medium hover:bg-zinc-200 transition-colors">
        contacto@jhonnysilva.pt
      </a>
    </div>
  </main>

  <!-- Rodapé / Links -->
  <footer class="w-full max-w-xl flex justify-center gap-6 py-4 text-sm text-zinc-500">
    <a href="https://github.com/Joao-P-Silva" target="_blank" rel="noopener noreferrer" class="hover:text-zinc-300 transition-colors">GitHub</a>
    <span>•</span>
    <a href="https://www.linkedin.com/in/joaosiilva/" target="_blank" rel="noopener noreferrer" class="hover:text-zinc-300 transition-colors">LinkedIn</a>
  </footer>

</body>
</html>
